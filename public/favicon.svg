<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient matching Navbar logo element -->
    <linearGradient id="navBgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006b2c" />
      <stop offset="50%" stop-color="#005221" />
      <stop offset="100%" stop-color="#003915" />
    </linearGradient>

    <!-- Pilot Jet Geometry Gradient matching Navbar exactly -->
    <linearGradient id="pilotLogoGrad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ffc97" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bdcaba" />
    </linearGradient>

    <!-- Subtle inner drop shadow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#003915" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Box matching Navbar rounded-xl & emerald border -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#navBgGrad)" stroke="#7ffc97" stroke-width="2" stroke-opacity="0.45" />

  <!-- Exact Logo Geometry from Header Button -->
  <g transform="translate(12, 12) scale(1.25)" filter="url(#softGlow)">
    <path
      d="M16 3L27 25L16 20.5L5 25L16 3Z"
      fill="url(#pilotLogoGrad)"
    />
    <path
      d="M16 3V20.5"
      stroke="#003915"
      stroke-width="1.6"
      stroke-linecap="round"
    />
    <circle cx="16" cy="11" r="1.75" fill="#003915" />
    <path
      d="M24 3L25 6L28 7L25 8L24 11L23 8L20 7L23 6L24 3Z"
      fill="#7ffc97"
    />
  </g>
</svg>
